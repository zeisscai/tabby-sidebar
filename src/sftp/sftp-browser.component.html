<div class="sftp-browser">
    <div class="sftp-toolbar">
        <button class="sftp-tool" type="button" title="上一级" aria-label="上一级"
                [disabled]="path === '/'"
                (click)="goUp()">
            <i class="fas fa-level-up-alt"></i>
        </button>

        <input *ngIf="editingPath !== null"
               class="path-input"
               type="text"
               autofocus
               [(ngModel)]="editingPath"
               (keydown.enter)="confirmPath()"
               (keydown.esc)="editingPath = null"
               (blur)="editingPath = null" />

        <div *ngIf="editingPath === null"
             class="sftp-breadcrumb"
             title="双击输入路径"
             (dblclick)="editPath()">
            <a class="crumb" (click)="navigate('/')">/</a>
            <a class="crumb" *ngFor="let segment of pathSegments" (click)="navigate(segment.path)">{{segment.name}}</a>
        </div>

        <button class="sftp-tool" type="button" title="输入路径" aria-label="输入路径" (click)="editPath()">
            <i class="fas fa-pen"></i>
        </button>
        <button class="sftp-tool" type="button" title="刷新" aria-label="刷新" (click)="refresh()">
            <i class="fas fa-sync-alt"></i>
        </button>
        <button class="sftp-tool" type="button" title="筛选" aria-label="筛选"
                [class.active]="showFilter"
                (click)="toggleFilter()">
            <i class="fas fa-filter"></i>
        </button>
        <button class="sftp-tool" type="button" title="新建文件夹" aria-label="新建文件夹" (click)="createDirectory()">
            <i class="fas fa-folder-plus"></i>
        </button>
        <button class="sftp-tool" type="button" title="上传文件" aria-label="上传文件" (click)="uploadFiles()">
            <i class="fas fa-file-upload"></i>
        </button>
        <button class="sftp-tool" type="button" title="上传文件夹" aria-label="上传文件夹" (click)="uploadDirectory()">
            <i class="fas fa-file-import"></i>
        </button>
    </div>

    <div class="sftp-filter-bar" *ngIf="showFilter">
        <input class="filter-input"
               type="text"
               autofocus
               placeholder="筛选文件或文件夹"
               [(ngModel)]="filterText"
               (keydown.escape)="clearFilter()" />
        <button class="sftp-tool" type="button" title="清除筛选" aria-label="清除筛选" (click)="clearFilter()">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <div class="sftp-body">
        <div class="sftp-message error" *ngIf="errorMessage">
            <div>{{errorMessage}}</div>
            <button class="retry" type="button" (click)="retry()">重试</button>
        </div>
        <div class="sftp-message" *ngIf="!errorMessage && !sftp">正在连接…</div>
        <div class="sftp-message" *ngIf="!errorMessage && sftp && fileList === null">正在加载…</div>

        <div class="sftp-list" *ngIf="!errorMessage && sftp && fileList !== null">
            <div class="sftp-row sftp-header">
                <span class="cell-icon"></span>
                <span class="cell-name">名称</span>
                <span class="cell-size">大小</span>
                <span class="cell-date">修改日期</span>
            </div>

            <div class="sftp-row sftp-item"
                 *ngFor="let item of visibleFileList; trackBy: trackItem"
                 [class.selected]="selectedPath === item.fullPath"
                 [title]="item.fullPath + ' (' + modeString(item) + ')'"
                 (click)="select(item)"
                 (dblclick)="openItem(item)"
                 (contextmenu)="showContextMenu(item, $event)">
                <span class="cell-icon"><i class="fa-fw" [class]="getIcon(item)"></i></span>
                <span class="cell-name">{{item.name}}</span>
                <span class="cell-size">{{item.isDirectory ? '' : formatSize(item.size)}}</span>
                <span class="cell-date">{{formatDate(item.modified)}}</span>
            </div>

            <div class="sftp-empty" *ngIf="visibleFileList.length === 0">
                {{ showFilter && filterText.trim() ? '没有匹配的文件' : '此文件夹为空' }}
            </div>
        </div>
    </div>
</div>
